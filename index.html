<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bridge-LAT Guizhou Safety Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#06275B;--deep:#031A3D;--red:#C80000;--ivory:#F8EBD3;--gold:#D6A03B;--ink:#4D8FC4;--white:#fff;--g:#1f7a3a;--a:#e8970c;--text:#1c2433;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Inter,system-ui,sans-serif;background:var(--ivory);color:var(--text)}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif}
a{color:inherit}button{font:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:2px solid var(--gold);flex-wrap:wrap}
nav .brand{font-weight:700;letter-spacing:.04em;margin-right:auto;font-size:14px}nav .brand small{font-weight:400;opacity:.8;display:block}
nav button{background:none;border:0;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px}
nav button.on{background:var(--navy);box-shadow:inset 0 -2px var(--gold)}
nav .sos{background:var(--red);font-weight:700;border-radius:20px;padding:8px 14px}
.hero{background:linear-gradient(180deg,var(--navy),var(--deep));color:#fff;position:relative;overflow:hidden;padding:36px 20px 90px}
.hero .in{max-width:1000px;margin:auto;position:relative;z-index:2;display:grid;gap:18px;grid-template-columns:1.4fr 1fr;align-items:center}
.eyebrow{letter-spacing:.25em;font-size:12px;color:var(--gold);text-transform:uppercase}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.05;margin:8px 0}.hero h1 em{display:block;color:var(--gold);font-weight:600}
.hero p{font-size:18px;max-width:34ch;margin:8px 0}
.seal{background:var(--red);padding:26px 20px;text-align:center;transform:rotate(-2deg);box-shadow:8px 8px 0 rgba(214,160,59,.35)}
.seal b{font:800 clamp(56px,12vw,96px)/1 'Noto Serif SC','Songti SC',serif;display:block}.seal span{letter-spacing:.5em;font-size:12px}
.mtn{position:absolute;left:0;right:0;bottom:-1px;height:90px;z-index:1}
.wrap{max-width:1000px;margin:auto;padding:18px 16px 60px}
.welcome{text-align:center;font-size:18px;margin:6px 0 18px}
.search{display:flex;background:#fff;border:2px solid var(--navy);border-radius:40px;overflow:hidden;margin:0 auto 14px;max-width:700px}
.search input{flex:1;border:0;padding:14px 18px;font-size:17px;min-width:0;background:#fff;color:var(--text)}.search input:focus{outline:3px solid var(--gold);outline-offset:-3px}
.search button{background:var(--red);color:#fff;border:0;padding:0 22px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:18px}
.pill{border-radius:20px;padding:4px 12px;font-weight:700;font-size:14px;color:#fff;display:inline-block}
.Red{background:var(--red)}.Amber{background:var(--a);color:#1c1200}.Green{background:var(--g)}
.h2{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font-size:26px;color:var(--navy)}.h2:before,.h2:after{content:"";flex:1;height:2px;background:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:#fffaf0;border:2px solid var(--red);outline:3px double var(--gold);outline-offset:-8px;padding:22px 20px;text-align:left;color:var(--navy);border-radius:4px;min-height:140px;display:block;width:100%}
.card:hover,.card:focus-visible{background:#fff;transform:translateY(-2px)}
.card .ic{font-size:34px}.card h3{margin:4px 0;font-size:20px}.card p{margin:0;color:var(--text);font-size:15px}
.help{background:var(--deep);color:#fff;padding:18px;border-radius:8px;margin-top:20px}
.help h2{margin:0 0 12px;color:var(--gold)}.help .row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.help button{padding:16px;border-radius:8px;border:2px solid var(--gold);background:var(--navy);color:#fff;font-weight:700;font-size:16px;text-align:left}
.help button.red{background:var(--red);border-color:#fff}
.box{background:#fff;border-left:6px solid var(--navy);padding:14px 16px;border-radius:6px;margin:10px 0}
.box.warn{border-color:var(--red);background:#fff3f0}.box.contact{border-color:var(--gold)}
.res{background:#fff;border-radius:8px;padding:14px 16px;margin:10px 0;border:1px solid #e3d3b2}
.res h3{margin:4px 0;font-size:19px;color:var(--navy)}.res p{margin:4px 0}.tag{font-size:13px;color:#555;margin-right:8px}
.btn{background:var(--navy);color:#fff;border:0;padding:10px 16px;border-radius:6px;font-weight:600;margin-top:6px}.btn.red{background:var(--red)}.btn.ghost{background:none;color:var(--navy);border:2px solid var(--navy)}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:8px 0}ol.steps li{counter-increment:s;display:flex;gap:12px;margin:10px 0;font-size:18px}
ol.steps li:before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;font-size:16px}
details{background:#fff;border:1px solid #e3d3b2;border-radius:6px;padding:10px 14px;margin:10px 0}summary{cursor:pointer;font-weight:700;color:var(--navy)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}.nums div{background:var(--red);color:#fff;border-radius:8px;padding:10px;text-align:center}.nums b{font-size:34px;display:block;line-height:1}
.emg{border:3px solid var(--red);background:#fff;border-radius:8px;padding:16px;margin:16px 0}.emg h3{margin:0 0 6px;color:var(--red);font-size:24px}.emg .now{background:var(--red);color:#fff;padding:12px;border-radius:6px;font-size:20px;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.filters select{padding:9px;border-radius:6px;border:2px solid var(--navy);background:#fff;color:var(--text);font-size:15px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fff;font-size:14px;min-width:760px}th{background:var(--navy);color:#fff;text-align:left;position:sticky;top:0}th,td{padding:8px;border-bottom:1px solid #e3d3b2;vertical-align:top}tr.r:hover{background:#fff6e0;cursor:pointer}
.crumb{background:none;border:0;color:var(--navy);font-weight:700;padding:6px 0}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--red);color:#fff;border:2px solid #fff;border-radius:30px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4)}
footer{background:var(--deep);color:#cdd6e6;padding:20px;text-align:center;font-size:13px}
@media(max-width:700px){.hero .in{grid-template-columns:1fr}.seal{order:-1;padding:14px}.seal b{font-size:56px}}
@media print{nav,.fab,.search{display:none}}

/* Visual alignment: editorial Guizhou poster typography and consistent icon treatment */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Kalam:wght@700&display=swap');
:root{--navy:#06275b;--deep:#031a3d;--red:#c80000;--ivory:#fff2dc;--gold:#d6a03b;--text:#10254b}
body{font-family:Inter,Arial,sans-serif;background:var(--ivory);color:var(--text)}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif}
nav{background:var(--deep);border-bottom:1px solid rgba(255,255,255,.55);padding:8px clamp(12px,4vw,56px);gap:8px}
nav .brand{font-size:16px;letter-spacing:.055em;line-height:1.35}
nav .brand small{display:inline;margin-left:14px;font-size:14px;letter-spacing:0}
nav button{font-weight:600;border-radius:3px}
nav button.on{background:var(--red);box-shadow:none;border-radius:24px}
nav .sos{border-radius:24px}
.hero{background:linear-gradient(110deg,#031a3d 0%,#06275b 66%,#173f76 100%);padding:38px 24px 82px}
.hero .in{max-width:1380px;grid-template-columns:1.6fr .75fr;gap:28px}
.eyebrow{font-size:13px;color:#fff;letter-spacing:.27em;font-weight:600}
.hero h1{font-size:clamp(38px,6vw,76px);line-height:.98;letter-spacing:-.035em;margin:14px 0}
.hero h1 em{font-family:'Kalam',cursive;font-size:1.02em;color:#fff0d7;font-weight:700;letter-spacing:-.025em}
.hero p{font-size:17px;letter-spacing:.025em}
.seal{background:var(--red);box-shadow:10px 10px 0 rgba(214,160,59,.18);transform:rotate(-2deg);border-radius:0}
.seal b{color:#fff0d7}
.wrap{max-width:1400px;padding:20px clamp(16px,4vw,60px) 60px}
.welcome{font-size:16px;color:#17345f}
.search{border-color:var(--navy);border-radius:28px;box-shadow:0 2px 0 rgba(6,39,91,.08)}
.search button{background:var(--red)}
.stats{gap:10px}
.stats>b{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy)}
.pill{font-size:14px;border-radius:22px;padding:6px 15px;color:white}
.Amber{color:#fff;background:#e8970c}
.h2{font-size:clamp(23px,2.6vw,32px);font-weight:700;justify-content:center;color:var(--navy);margin:28px 0 20px}
.h2:before,.h2:after{background:#b77b19;height:2px;max-width:260px}
.cards{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{position:relative;background:rgba(255,248,235,.94);border:1.5px solid var(--red);outline:1px solid var(--red);outline-offset:3px;border-radius:2px;min-height:176px;padding:18px 12px 20px;text-align:center;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px}
.card:before,.card:after{content:"";position:absolute;width:13px;height:13px;border:1px solid var(--red)}
.card:before{top:3px;left:3px;border-right:0;border-bottom:0}.card:after{right:3px;bottom:3px;border-left:0;border-top:0}
.card .ic{font-size:42px;line-height:1.15;color:var(--navy);font-weight:800;filter:drop-shadow(0 1px 0 #9bb9d7)}
.card h3{font-family:Inter,Arial,sans-serif;font-size:clamp(15px,1.2vw,19px);line-height:1.22;font-weight:800;margin:4px 0}
.card p{font-size:13px;line-height:1.35;color:#263d63}
.card:hover,.card:focus-visible{background:#fff5e4;transform:translateY(-2px);box-shadow:0 5px 12px #06275b20}
.help{background:var(--deep);border-radius:2px}
@media(max-width:700px){.hero .in{grid-template-columns:1fr}.seal{order:-1}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}nav .brand small{display:block;margin-left:0}}

<script>
const D=[{"id": "PRE-01", "cat": "Pre-departure", "sc": "Entry documents (visa-free entry, passports)", "lvl": "Green", "sop": "1. Check the official immigration source for current entry rules (Malaysian passport holders: visa-free up to 30 days through 31 Dec 2026 per sources found; passport valid 6+ months).\n2. Check whether a digital arrival card is required.\n3. Collect passport copies for all 30 people and file in the master folder.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": "Need to fill in China Digital Entry Card"}, {"id": "PRE-02", "cat": "Pre-departure", "sc": "Parental consent and indemnity", "lvl": "Green", "sop": "1. Collect signed consent, medical declaration and emergency contact for all 17 students.\n2. Obtain parent/guardian consent where applicable.\n3. Explain the consent/indemnity terms and file records securely; keep controlled-access copies in the master file.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "PRE-03", "cat": "Pre-departure", "sc": "Insurance (travel, medical, evacuation)", "lvl": "Green", "sop": "1. Confirm travel, medical and evacuation cover for all 30 people and verify the coverage period/scope.\n2. Record policy numbers, emergency assistance and 24-hour claims contacts in Emergency Contacts.\n3. Brief responsible staff on notification and claims steps; retain receipts and medical reports for follow-up after return.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "PRE-04", "cat": "Pre-departure", "sc": "Medical screening and dietary needs", "lvl": "Green", "sop": "1. Collect complete medical, allergy, chronic-condition, medication and dietary declarations (halal, vegetarian and other restrictions).\n2. Keep sensitive information confidential and limit access to staff who need it.\n3. Check that personal medication is sufficient, in original packaging where applicable, and supported by required documentation; verify relevant import/airline restrictions.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "PRE-05", "cat": "Pre-departure", "sc": "Mandatory pre-departure briefing", "lvl": "Green", "sop": "1. Brief participants and lecturers on welfare, health, safety, discipline, risk controls, curfew, incident reporting and emergency procedures.\n2. Explain the limits of institutional responsibility and rules for independent activities outside the official schedule.\n3. Collect acknowledgement signatures and retain the record.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "PRE-06", "cat": "Pre-departure", "sc": "Emergency contact tree", "lvl": "Green", "sop": "1. Prepare an emergency contact tree covering 110 police, 120 ambulance, 119 fire, 122 traffic, embassy/consulate, insurer, home institution, Guiyang counterpart, nearby hospital/health facilities and participant next-of-kin.\n2. Define who calls whom, reporting order and escalation by incident level.\n3. Distribute paper and phone copies and keep a controlled master copy.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "PRE-07", "cat": "Pre-departure", "sc": "Digital readiness (WeChat, SIM, payments)", "lvl": "Green", "sop": "1. Identify and install required communication, navigation, translation, transport and payment apps before departure.\n2. Test account access, phone-number verification and app functionality; note that some services may not work reliably in China.\n3. Arrange eSIM/roaming, Wi-Fi and backup contact methods.\n4. Test Alipay/WeChat Pay with an accepted payment method and advise a cash backup.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "PRE-08", "cat": "Pre-departure", "sc": "Packing for cold, damp weather", "lvl": "Green", "sop": "1. Advise warm layers, rain gear and comfortable shoes.\n2. Late November in Guiyang is cool and drizzly, much colder than students are used to.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "TRA-01", "cat": "Travel & transit", "sc": "Flight delay or cancellation", "lvl": "Amber", "sop": "1. Leader contacts the airline and keeps the group together.\n2. Arrange meals and rest.\n3. Update parents with one official message.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": "Travel insurance bought"}, {"id": "TRA-02", "cat": "Travel & transit", "sc": "Missed connection", "lvl": "Amber", "sop": "1. Keep the full group together where possible.\n2. If split, the group leader stays with the stranded students.\n3. Re-book via the airline desk.", "esc": "Safety lead + Trip leader", "st": "In progress", "notes": "students will be separated into small lecturers-students buddy group to ease montoring"}, {"id": "TRA-03", "cat": "Travel & transit", "sc": "Lost passport", "lvl": "Amber", "sop": "1. Report the missing passport to local police and obtain a police report.\n2. Contact the embassy/consulate for an emergency travel document and notify the Safety lead/Trip leader.\n3. Use the secure passport copy in the master file and record actions in the Incident Log.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": "Compilation of hard copy to ease management "}, {"id": "TRA-04", "cat": "Travel & transit", "sc": "Lost luggage", "lvl": "Green", "sop": "1. Lodge a property irregularity report for lost/delayed baggage and record the claim number.\n2. Record and report missing personal belongings; escalate if medication or essential documents are affected.\n3. Keep essential medication and key documents in hand luggage where appropriate; preserve receipts and claim records.", "esc": "Group leader", "st": "Ready", "notes": "Travel insurance bought"}, {"id": "TRA-05", "cat": "Travel & transit", "sc": "Customs issues (medication, electronics, power banks)", "lvl": "Amber", "sop": "1. Declare medication and electronics.\n2. Power banks must follow airline and Chinese aviation rules; check current rules for domestic flights.\n3. No vapes or restricted items.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": null}, {"id": "TRA-06", "cat": "Travel & transit", "sc": "Headcount at transitions", "lvl": "Green", "sop": "1. Conduct headcounts at each transition (leaving accommodation, boarding, arriving, before sleep and activity transitions).\n2. Use buddy pairs or small groups during movements and outdoor activities.\n3. Group leaders report discrepancies immediately to the Safety lead and do not resume movement until resolved.", "esc": "Group leader", "st": "Needs action", "notes": "Daily reminder and briefing will be conducted"}, {"id": "TRA-07", "cat": "Travel & transit", "sc": "Road accident", "lvl": "Red", "sop": "1. Check for injuries; call 120 and 122/110.\n2. Document the scene.\n3. Inform the counterpart and Safety lead.\n4. Do not argue about blame on the spot.", "esc": "Safety lead + Trip leader", "st": "Not started", "notes": null}, {"id": "TRA-08", "cat": "Travel & transit", "sc": "Train or bus mix-up", "lvl": "Green", "sop": "1. Everyone has the departure time and meeting point written down.\n2. Arrive early.\n3. A late student is met by their group leader and not left alone.", "esc": "Group leader", "st": "In progress", "notes": "Daily reminder and briefing will be conducted"}, {"id": "HEA-01", "cat": "Health", "sc": "Mild illness (cold, stomach upset)", "lvl": "Green", "sop": "1. Rest, fluids and check-in every few hours.\n2. Escalate if there is fever or symptoms last beyond 24 hours.", "esc": "Group leader", "st": "Ready", "notes": "Students are aware"}, {"id": "HEA-02", "cat": "Health", "sc": "Food poisoning", "lvl": "Amber", "sop": "1. Stop eating the suspect food and hydrate.\n2. Seek care and check others who ate the same meal.\n3. Photograph the menu/meal and inform the counterpart.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": "Students should take photo evert meal and beverages they took"}, {"id": "HEA-03", "cat": "Health", "sc": "Allergic reaction or anaphylaxis", "lvl": "Red", "sop": "1. Use the epinephrine pen if the student carries one.\n2. Call 120.\n3. Tell the hospital the allergen.", "esc": "Safety lead + Trip leader", "st": "Not started", "notes": null}, {"id": "HEA-04", "cat": "Health", "sc": "Halal / dietary problems", "lvl": "Green", "sop": "1. Confirm halal status with providers in advance and identify suitable alternatives.\n2. Record and communicate allergies, vegetarian needs and other dietary restrictions; check ingredients and cross-contact risks where relevant.\n3. Consider local food characteristics (including spicy/sour dishes and pork/lard stock) and coordinate backup food with the counterpart.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "HEA-05", "cat": "Health", "sc": "Chronic condition flare-up", "lvl": "Amber", "sop": "1. Confirm each participant's care plan, medication needs and required supporting documents with the designated medical liaison.\n2. Provide appropriate support while respecting confidentiality.\n3. Seek medical assistance if symptoms do not settle or warning signs appear; record follow-up actions.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": "Students has been Identify"}, {"id": "HEA-06", "cat": "Health", "sc": "Injury", "lvl": "Amber", "sop": "1. Provide first aid within competence and arrange clinic/hospital assessment as needed.\n2. Notify the Safety lead/Trip leader and coordinate with the hospital, organiser, insurer and next-of-kin as appropriate.\n3. Keep receipts, medical reports and incident records for insurance and post-trip follow-up.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "HEA-07", "cat": "Health", "sc": "Cold exposure", "lvl": "Green", "sop": "1. Layers, warm drinks and rest.\n2. Do not leave students outside in rain or wind for long.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "HEA-08", "cat": "Health", "sc": "Women's health", "lvl": "Green", "sop": "1. Female lecturers keep a discreet supply of sanitary items.\n2. Provide a private point of contact.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "HEA-09", "cat": "Health", "sc": "Mental health or distress (homesickness, panic, anxiety)", "lvl": "Amber", "sop": "1. Check welfare regularly and respond promptly to distress, homesickness, panic or anxiety.\n2. Listen calmly in a private space, stay with the participant and involve a trusted lecturer where appropriate.\n3. Escalate immediately if safety is at risk; record actions and check whether follow-up is needed after return.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "HEA-10", "cat": "Health", "sc": "Infectious illness (flu etc.)", "lvl": "Amber", "sop": "1. Isolate the student in a separate room; wear masks.\n2. Seek care.\n3. Check on close contacts.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": "students are reminded to bring mask"}, {"id": "HEA-11", "cat": "Health", "sc": "Hospital visit", "lvl": "Amber", "sop": "1. Take the participant's passport, relevant medical information and insurance details; arrange a Mandarin-speaking helper or translation app.\n2. Ensure a lecturer remains with the participant and coordinate with the hospital, organiser, insurer and next-of-kin as appropriate.\n3. Keep reports/receipts and assign responsibility for post-trip follow-up of any unresolved care or claim.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": "Will  have hard copy compilation just in case"}, {"id": "ACC-01", "cat": "Accommodation", "sc": "Room allocation", "lvl": "Green", "sop": "1. Coordinate rooming before departure at Politeknik Port Dickson and throughout the China stay; confirm room allocations, check-in/out, basic needs and key contact points.\n2. Separate rooms by gender and place a lecturer on the same floor or nearby where practicable.\n3. Check facilities, accommodation rules, safety arrangements and keep the room list in the secure master file.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "ACC-02", "cat": "Accommodation", "sc": "Fire or evacuation", "lvl": "Red", "sop": "1. On arrival, identify exits, alarms, emergency procedures and the assembly point at each accommodation/site.\n2. Explain the emergency response plan to participants and staff.\n3. In a fire or evacuation, call 119, evacuate safely, assemble and conduct a headcount; report missing people immediately.", "esc": "Safety lead + Trip leader + Embassy/Consulate + Insurer + Home institution", "st": "Ready", "notes": "Email to EM are prepared"}, {"id": "ACC-03", "cat": "Accommodation", "sc": "Theft from rooms", "lvl": "Amber", "sop": "1. Use safes and locks.\n2. Report to the front desk and counterpart.\n3. Lodge a police report for anything valuable.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": "Daily reminder and briefing will be conducted"}, {"id": "ACC-04", "cat": "Accommodation", "sc": "Visitors in rooms", "lvl": "Green", "sop": "1. No outsiders in rooms.\n2. Meetings happen in public areas.", "esc": "Group leader", "st": "Ready", "notes": "same gender allowed"}, {"id": "ACC-05", "cat": "Accommodation", "sc": "Curfew breaches", "lvl": "Green", "sop": "1. Set the curfew and enforce it with a headcount.\n2. Apply consequences consistently.", "esc": "Group leader", "st": "Ready", "notes": "Just don't go cause any amber level issues"}, {"id": "ACC-06", "cat": "Accommodation", "sc": "Police registration of foreigners", "lvl": "Green", "sop": "1. Foreigners must be registered with local police.\n2. Hotels or campus housing normally do this; confirm with the counterpart.", "esc": "Group leader", "st": "Ready", "notes": "Prepared by China side"}, {"id": "SEC-01", "cat": "Security & personal safety", "sc": "Pickpocketing", "lvl": "Green", "sop": "1. Keep valuables on the body.\n2. Be careful in crowds, stations and markets.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": " sign anything you do not understand.\n3. Ask to contact the embassy/consulate and the counterpart.\n4. Never resist.\n5. Inform the Trip leader immediately.", "esc": "Safety lead + Trip leader + Embassy/Consulate + Insurer + Home institution", "st": "Needs action", "notes": "Email to EM are prepared"}, {"id": "LEG-02", "cat": "Legal & cultural", "sc": "Photography restrictions", "lvl": "Green", "sop": "1. Do not photograph military or government sites, checkpoints or police.\n2. No drones.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "LEG-03", "cat": "Legal & cultural", "sc": "Politics and religion", "lvl": "Green", "sop": "1. Avoid political discussion and religious proselytising.\n2. Behave respectfully.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "LEG-04", "cat": "Legal & cultural", "sc": "Alcohol and drugs", "lvl": "Amber", "sop": "1. Zero tolerance for drugs; drug offences are very serious in China.\n2. Alcohol is a conduct matter set in the code of conduct.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "LEG-05", "cat": "Legal & cultural", "sc": "Social media conduct", "lvl": "Green", "sop": "1. Do not post sensitive content, real-time locations or anything that could embarrass the group or host.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "LEG-06", "cat": "Legal & cultural", "sc": "Dress, conduct and prayer needs", "lvl": "Green", "sop": "1. Explain respectful dress and conduct.\n2. For Muslim participants/lecturers, coordinate prayer times, suitable space, qibla direction and necessary equipment (for example telekung, sejadah or compass) where applicable.\n3. Adjust activity timing where practical and communicate arrangements to the counterpart.", "esc": "Group leader", "st": "Ready", "notes": "Prayer are based on opportunity rather than "}, {"id": "LEG-07", "cat": "Legal & cultural", "sc": "Relationships policy", "lvl": "Green", "sop": "1. State the policy clearly (no romantic or intimate relationships with locals or within the group on the trip).\n2. State the discipline process.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": "settle sendiri"}, {"id": "COM-01", "cat": "Communication & money", "sc": "No signal or phone loss", "lvl": "Green", "sop": "1. Use the buddy system and fixed rendezvous points.\n2. Confirm eSIM/roaming/Wi-Fi or another workable contact method and a backup channel before moving.\n3. Keep emergency contacts on paper and phone; agree how participants check in and what to do when out of signal.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "COM-02", "cat": "Communication & money", "sc": "Lost or stolen phone", "lvl": "Green", "sop": "1. Lock it remotely and tell the leader.\n2. Report to police if needed.\n3. Provide a spare device.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "COM-03", "cat": "Communication & money", "sc": "Lost cash or cards", "lvl": "Green", "sop": "1. Block cards with the issuing bank.\n2. Use the group emergency fund.", "esc": "Group leader", "st": "Ready", "notes": null}, {"id": "COM-04", "cat": "Communication & money", "sc": "Payment failure", "lvl": "Green", "sop": "1. Carry cash backup.\n2. Finance lead holds the emergency fund.", "esc": "Group leader", "st": "Ready", "notes": "Bring 200 yuan"}, {"id": "ENV-01", "cat": "Environment & activities", "sc": "Heavy rain or fog", "lvl": "Amber", "sop": "1. Slow down travel and avoid mountain or rural roads in poor conditions.\n2. Leader decides whether to continue.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "ENV-02", "cat": "Environment & activities", "sc": "Landslide or road closure", "lvl": "Amber", "sop": "1. Stay in a safe place and do not drive through.\n2. Wait for official advice.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "ENV-03", "cat": "Environment & activities", "sc": "Earthquake", "lvl": "Red", "sop": "1. Drop, cover and hold.\n2. After the shaking, assemble outside and count heads.", "esc": "Safety lead + Trip leader + Embassy/Consulate + Insurer + Home institution", "st": "Ready", "notes": "Email to EM are prepared"}, {"id": "ENV-04", "cat": "Environment & activities", "sc": "Poor air quality", "lvl": "Green", "sop": "1. Masks.\n2. Limit outdoor activity.", "esc": "Group leader", "st": "Ready", "notes": "Bring mask"}, {"id": "ENV-05", "cat": "Environment & activities", "sc": "Site visits and tours", "lvl": "Green", "sop": "1. Prepare a risk assessment for each site visit, airport/transit movement and outdoor activity.\n2. Assign staff to the front/back or designated small groups; conduct headcounts and apply the buddy system.\n3. Check weather, route, facilities/toilets, meeting points and emergency access; follow the approved itinerary and management instructions.", "esc": "Group leader", "st": "Ready", "notes": "Prepared by China side and will supported by daily briefing session"}, {"id": "GRO-01", "cat": "Group management", "sc": "Student refuses instructions", "lvl": "Amber", "sop": "1. Speak privately and apply the code of conduct.\n2. Escalate to the Trip leader.\n3. Persistent breaches can lead to early return at their own cost.", "esc": "Safety lead + Trip leader", "st": "Needs action", "notes": "Akta 174"}, {"id": "GRO-02", "cat": "Group management", "sc": "Conflict between students", "lvl": "Green", "sop": "1. Separate and listen to both.\n2. Mediate and record it.", "esc": "Group leader", "st": "Needs action", "notes": "settle sendiri"}, {"id": "GRO-03", "cat": "Group management", "sc": "Student wants to leave the group", "lvl": "Amber", "sop": "1. Participants must not leave the group alone or make unapproved itinerary changes.\n2. For any permitted independent/free-time activity, explain the approval, check-in, buddy and return-time rules and institutional/individual responsibility boundaries.\n3. Escalate non-compliance to the Trip leader and record relevant incidents.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": "Akta 174"}, {"id": "GRO-04", "cat": "Group management", "sc": "Lecturer ill or unable to perform duty", "lvl": "Amber", "sop": "1. Deputy covers.\n2. Rebalance group supervision.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "GRO-05", "cat": "Group management", "sc": "Lecturer misconduct", "lvl": "Amber", "sop": "1. Report to the Trip leader and the home institution.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "GRO-06", "cat": "Group management", "sc": "Disagreement about decisions", "lvl": "Green", "sop": "1. Trip leader's decision is final in an emergency.\n2. Debrief afterwards.", "esc": "Safety lead + Trip leader", "st": "Ready", "notes": null}, {"id": "SER-01", "cat": "Serious emergencies", "sc": "Death, critical injury or evacuation", "lvl": "Red", "sop": "1. Secure the scene and call appropriate emergency services (including 120/110 where applicable); protect the rest of the group.\n2. Notify the Safety lead/Trip leader, embassy/consulate, insurer and home institution promptly; coordinate with hospital/organiser and the participant's next-of-kin.\n3. One authorised person manages family communication; participants must not post sensitive incident details online.\n4. Record chronology, decisions, contacts and actions in the Incident Log.\n5. Review mitigation effectiveness and unresolved welfare/health/insurance matters after return; include lessons in the post-program report.", "esc": "Safety lead + Trip leader + Embassy/Consulate + Insurer + Home institution", "st": "Ready", "notes": "Email to EM are prepared"}];

function search(q){q=(q||'').toLowerCase().trim();const tk=q.split(/\W+/).filter(Boolean);let ex=tk.map(t=>SYN[t]||'').join(' ');
const sc=D.map(x=>{const h=(x.sc+' '+x.cat).toLowerCase(),b=x.sop.toLowerCase();let s=0;tk.concat(ex.split(' ')).filter(Boolean).forEach((t,i)=>{const w=i<tk.length?1:.6;if(h.includes(t))s+=3*w;else if(b.includes(t))s+=w});if(q&&h.includes(q))s+=5;return[x,s]}).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,12);
return `<div class="wrap"><button class="crumb" data-go="home">← Home</button>${sbox(q)}<h2 class="serif" style="color:var(--navy)">${q?`Results for “${esc(q)}”`:'Search'}</h2>${sc.length?sc.map(a=>card(a[0])).join(''):`<p>${q?'No results. Try other words, like “passport”, “sick” or “police”.':'Type what you need help with.'}</p>`}<p><b>Emergency?</b> <button class="btn red" data-go="emergency">Open Emergency Help</button></p></div>`}
function contacts(){return `<div class="wrap"><button class="crumb" data-go="home">← Home</button><h1 class="serif" style="color:var(--navy)">Contacts</h1>
<div class="box"><h3 class="serif" style="margin:0">Emergency numbers in China</h3><div class="nums">${NUMS.map(a=>`<div><b>${a[0]}</b>${a[1]}</div>`).join('')}</div></div>
<div class="box contact"><h3 class="serif" style="margin:0">Programme contacts</h3><p>The workbook lists who to contact by role, but does <b>not</b> include names or phone numbers. These must be confirmed and added:</p><ul><li>Safety lead — <b>to be confirmed</b></li><li>Trip leader — <b>to be confirmed</b></li><li>Group leader — <b>to be confirmed</b></li><li>Guiyang counterpart — <b>to be confirmed</b></li><li>Embassy / Consulate — <b>to be confirmed</b></li><li>Insurer (24-hour line) — <b>to be confirmed</b></li><li>Home institution — <b>to be confirmed</b></li><li>Nearby hospital — <b>to be confirmed</b></li></ul></div>
<button class="btn" data-go="sop:PRE-06">See the emergency contact tree procedure</button></div>`}
function lecturer(){const cs=[...new Set(D.map(x=>x.cat))],ss=[...new Set(D.map(x=>x.st))];
return `<div class="wrap" style="max-width:1200px"><button class="crumb" data-go="home">← Home</button><h1 class="serif" style="color:var(--navy)">Lecturer Reference</h1>
<div class="stats" style="justify-content:flex-start"><b>${D.length} scenarios</b><span class="pill Red">High ${D.filter(x=>x.lvl=='Red').length}</span><span class="pill Amber">Medium ${D.filter(x=>x.lvl=='Amber').length}</span><span class="pill Green">Low ${D.filter(x=>x.lvl=='Green').length}</span></div>
<details><summary>Escalation overview</summary><ul><li><b>Low / Medium:</b> Group leader, or Safety lead + Trip leader (as listed per scenario).</li><li><b>High (6 scenarios):</b> Safety lead + Trip leader + Embassy/Consulate + Insurer + Home institution.</li></ul><p>Use the “Escalate to” column for each scenario. Record actions in the Incident Log (see SER-01).</p></details>
<div class="filters"><select id="fc"><option value="">All categories</option>${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="fl"><option value="">All risk levels</option><option value="Red">High (Red)</option><option value="Amber">Medium (Amber)</option><option value="Green">Low (Green)</option></select><select id="fs"><option value="">All statuses</option>${ss.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="fq" placeholder="Filter by keyword" style="padding:9px;border:2px solid var(--navy);border-radius:6px"></div>
<p id="cnt"></p><div class="tw"><table><thead><tr><th>ID</th><th>Category</th><th>Scenario</th><th>Level</th><th>Escalate to</th><th>Status</th><th>Notes</th></tr></thead><tbody id="tb"></tbody></table></div></div>`}
function ltab(){const c=$('#fc').value,l=$('#fl').value,s=$('#fs').value,q=$('#fq').value.toLowerCase();
const r=D.filter(x=>(!c||x.cat===c)&&(!l||x.lvl===l)&&(!s||x.st===s)&&(!q||(x.sc+x.sop+x.id).toLowerCase().includes(q)));
$('#cnt').textContent=`Showing ${r.length} of ${D.length}`;
$('#tb').innerHTML=r.map(x=>`<tr class="r" data-go="sop:${x.id}"><td>${x.id}</td><td>${esc(x.cat)}</td><td><b>${esc(x.sc)}</b></td><td>${lv(x.lvl)}</td><td>${esc(x.esc)}</td><td>${esc(x.st)}</td><td>${esc(x.notes)}</td></tr>`).join('')}
function render(){const h=decodeURIComponent(location.hash.slice(1))||'home',[k,...r]=h.split(':'),a=r.join(':');let v;
mode=k==='lecturer'||mode==='lecturer'&&k==='sop'?'lecturer':'student';
if(k==='cat'&&CATS.find(x=>x.k===a))v=cat(a);else if(k==='sop'&&by(a))v=sop(a);else if(k==='emergency')v=emergency();else if(k==='search')v=search(a);else if(k==='contacts')v=contacts();else if(k==='lecturer')v=lecturer();else v=home();
navr(k);$('#app').innerHTML=v;
const sf=$('#searchForm');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();const q=sf.querySelector('input[name="q"]').value.trim();go('search:'+q)});
if(k==='lecturer'){['fc','fl','fs'].forEach(i=>$('#'+i).onchange=ltab);$('#fq').oninput=ltab;ltab()}scrollTo(0,0)}
function go(h){location.hash=encodeURIComponent(h)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)go(t.dataset.go)});
$('#fab').onclick=()=>go('emergency');addEventListener('hashchange',render);render();
</script></body></html>
